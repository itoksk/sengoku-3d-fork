name: 不具合・まちがいの報告
description: 表示がおかしい、陣の位置がずれている、年号がちがう、など
title: "[報告] "
labels: ["不具合"]
body:
  - type: input
    id: page
    attributes:
      label: ページ
      placeholder: 例）https://k-ito-schoolagent.github.io/sengoku-3d/sekigahara/ の第三幕
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか・何がちがうか
      description: スクリーンショットを貼ってもらえると助かります
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 使っている端末・ブラウザ
      placeholder: 例）iPad / Safari、Windows / Chrome、Chromebook
